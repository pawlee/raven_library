core: null
templates: null
traits:
    due:
        type: date
    priority:
        default: medium
        type: enum
        values:
            - low
            - medium
            - high
    todo:
        default: todo
        type: enum
        values:
            - todo
            - done
types:
    issue:
        default_path: issues/
        description: A work item with queryable status, optionally linked to a project and/or code repository
        fields:
            blocked_by:
                description: Issues that must be completed first
                target: issue
                type: ref[]
            name:
                required: true
                type: string
            parent:
                description: PRD or planning document that spawned this issue
                target: repo-doc
                type: ref
            project:
                description: The project this issue belongs to, when applicable
                target: project
                type: ref
            repository:
                description: The code repository this issue belongs to, when applicable
                target: repository
                type: ref
            status:
                description: Current lifecycle state
                required: true
                type: enum
                values:
                    - draft
                    - ready
                    - in_progress
                    - blocked
                    - done
                    - dropped
        name_field: name
    meeting:
        default_path: meeting/
        description: A meeting note, optionally related to a project and issues
        fields:
            attendees:
                description: People who attended or participated in the meeting
                target: person
                type: ref[]
            date:
                description: Date of the meeting
                type: date
            issues:
                description: Issues discussed or followed up in the meeting
                target: issue
                type: ref[]
            name:
                required: true
                type: string
            project:
                description: The project this meeting is related to, when applicable
                target: project
                type: ref
        name_field: name
    person:
        default_path: person/
        description: People and contacts
        fields:
            email:
                description: Primary contact email
                type: string
            name:
                required: true
                type: string
        name_field: name
    project:
        default_path: project/
        fields:
            contacts:
                description: People associated with this project
                target: person
                type: ref[]
            name:
                required: true
                type: string
            repositories:
                description: Code repositories that implement this project; may be linked after the repository decision
                target: repository
                type: ref[]
        name_field: name
    project-doc:
        default_path: project-docs/
        description: Documents belonging to a project, independent of any Git repository
        fields:
            date:
                description: Date relevant to this document
                type: date
            kind:
                description: Kind of project document
                required: true
                type: enum
                values:
                    - overview
                    - discovery
                    - decision
                    - requirements
                    - runbook
            name:
                required: true
                type: string
            project:
                description: The project this document belongs to
                required: true
                target: project
                type: ref
        name_field: name
    repo-doc:
        default_path: repo-docs/
        description: Repository-linked glossary, code map, convention, architecture note, decision, runbook, or PRD
        fields:
            kind:
                description: Kind of repository reference document
                required: true
                type: enum
                values:
                    - glossary
                    - code-map
                    - conventions
                    - decision
                    - architecture
                    - runbook
                    - prd
            name:
                required: true
                type: string
            repository:
                description: The code repository this document belongs to
                required: true
                target: repository
                type: ref
        name_field: name
    repository:
        default_path: repositories/
        description: A code repository and its durable agent-facing context
        fields:
            name:
                required: true
                type: string
            path:
                description: Local filesystem path to the repository root
                type: string
            remote:
                description: Canonical Git remote URL or SSH address for identifying the codebase
                type: string
        name_field: name
version: 1
